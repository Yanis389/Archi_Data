.0,240.0" fill="none" stroke="#5b6770" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/><rect x="370.0" y="36.0" width="215.0" height="78.0" rx="5" fill="#fdf0d5" stroke="#b8860b" stroke-width="1.3"/><text x="477.5" y="59.5" text-anchor="middle" font-size="10" fill="#6b4e06" font-weight="700">BRONZE / Raw (HDFS)</text><text x="477.5" y="72.0" text-anchor="middle" font-size="8.5" fill="#6b4e06" opacity=".8">Fichiers .dat tels que reçus, partitionnés</text><text x="477.5" y="84.5" text-anchor="middle" font-size="8.5" fill="#6b4e06" opacity=".8">par source et date d&#x27;ingestion, avec</text><text x="477.5" y="97.0" text-anchor="middle" font-size="8.5" fill="#6b4e06" opacity=".8">manifeste de provenance</text><rect x="400.0" y="124.0" width="155.0" height="34.0" rx="5" fill="#ffffff" stroke="#1b3a57" stroke-width="1.3"/><text x="477.5" y="138.5" text-anchor="middle" font-size="8.5" fill="#1b3a57" font-weight="500">Spark : typage, nettoyage,</text><text x="477.5" y="149.1" text-anchor="middle" font-size="8.5" fill="#1b3a57" font-weight="500">contrôles</text><rect x="370.0" y="168.0" width="215.0" height="78.0" rx="5" fill="#e4eef8" stroke="#2c6fb0" stroke-width="1.3"/><text x="477.5" y="191.6" text-anchor="middle" font-size="10" fill="#173f66" font-weight="700">SILVER (HDFS, Parquet)</text><text x="477.5" y="204.1" text-anchor="middle" font-size="8.5" fill="#173f66" opacity=".8">Tables typées et nommées, doublons traités,</text><text x="477.5" y="216.6" text-anchor="middle" font-size="8.5" fill="#173f66" opacity=".8">relations contrôlées, lignes rejetées</text><text x="477.5" y="229.1" text-anchor="middle" font-size="8.5" fill="#173f66" opacity=".8">isolées</text><rect x="400.0" y="256.0" width="155.0" height="34.0" rx="5" fill="#ffffff" stroke="#1b3a57" stroke-width="1.3"/><text x="477.5" y="270.5" text-anchor="middle" font-size="8.5" fill="#1b3a57" font-weight="500">Spark : jointures, agrégats,</text><text x="477.5" y="281.1" text-anchor="middle" font-size="8.5" fill="#1b3a57" font-weight="500">modèle</text><rect x="370.0" y="300.0" width="215.0" height="78.0" rx="5" fill="#e3f3ea" stroke="#1e7b4b" stroke-width="1.3"/><text x="477.5" y="323.6" text-anchor="middle" font-size="10" fill="#14452a" font-weight="700">GOLD (HDFS, Parquet)</text><text x="477.5" y="336.1" text-anchor="middle" font-size="8.5" fill="#14452a" opacity=".8">Modèle en étoile : faits partitionnés par</text><text x="477.5" y="348.6" text-anchor="middle" font-size="8.5" fill="#14452a" opacity=".8">date, dimensions conformes, KPI du</text><text x="477.5" y="361.1" text-anchor="middle" font-size="8.5" fill="#14452a" opacity=".8">dictionnaire</text><path d="M340.0,80.0 L365.0,75.0" fill="none" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arr)"/><path d="M477.5,114.0 L472.5,124.0" fill="none" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arr)"/><path d="M477.5,158.0 L472.5,168.0" fill="none" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arr)"/><path d="M477.5,246.0 L472.5,256.0" fill="none" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arr)"/><path d="M477.5,290.0 L472.5,300.0" fill="none" stroke="#5b6770" stroke-width="1.2" marker-end="url(#arr)"/><text x="485.5" y="136" font-size="8" fill="#5b6770"></text><rect x="620.0" y="36.0" width="170.0" height="58.0" rx="5" fill="#d9efef" stroke="#1a8f8f" stroke-width="1.3"/><text x="705.0" y="62.3" text-anchor="middle" font-size="9" fill="#0e5656" font-weight="700">Spark SQL / requêtes</text><text x="705.0" y="73.6" text-anchor="middle" font-size="7.5" fill="#0e5656" opacity=".8">KPI et analyses ad hoc</text><rect x="620.0" y="106.0" width="170.0" height="58.0" rx="5" fill="#d9efef" stroke="#1a8f8f" stroke-width="1.3"/><text x="705.0" y="132.3" text-anchor="middle" font-size="9" fill="#0e5656" font-weight="700">Tableaux de bord KPI</text><text x="705.0" y="143.6" text-anchor="middle" font-size="7.5" fill="#0e5656" opacity=".8">CA, panier, retours, stocks</text><rect x="620.0" y