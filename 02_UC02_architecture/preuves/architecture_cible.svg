<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Helvetica, Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6770"/></marker></defs><text x="90.0" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#1b3a57">1. Sources</text><text x="270.0" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#1b3a57">2. Ingestion</text><text x="477.5" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#1b3a57">3-5. Stockage et préparation</text><text x="705.0" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#1b3a57">6. Exposition</text><rect x="10.0" y="36.0" width="160.0" height="62.0" rx="5" fill="#e3f3ea" stroke="#1e7b4b" stroke-width="1.3"/><text x="90.0" y="64.3" text-anchor="middle" font-size="9" fill="#14452a" font-weight="700">TPCx-BB data/</text><text x="90.0" y="75.6" text-anchor="middle" font-size="7.5" fill="#14452a" opacity=".8">23 tables .dat, 977,0 Mo</text><rect x="10.0" y="110.0" width="160.0" height="56.0" rx="5" fill="#e3f3ea" stroke="#1e7b4b" stroke-width="1.3"/><text x="90.0" y="129.7" text-anchor="middle" font-size="9" fill="#14452a" font-weight="700">TPCx-BB data_refresh/</text><text x="90.0" y="141.0" text-anchor="middle" font-size="7.5" fill="#14452a" opacity=".8">11 tables .dat, complément</text><text x="90.0" y="152.2" text-anchor="middle" font-size="7.5" fill="#14452a" opacity=".8">incrémental</text><rect x="10.0" y="178.0" width="160.0" height="44.0" rx="5" fill="#e3f3ea" stroke="#1e7b4b" stroke-width="1.3"/><text x="90.0" y="197.3" text-anchor="middle" font-size="9" fill="#14452a" font-weight="500">Fichiers d&#x27;audit .csv</text><text x="90.0" y="208.6" text-anchor="middle" font-size="7.5" fill="#14452a" opacity=".8">item_marketprices_audit</text><rect x="10.0" y="234.0" width="160.0" height="62.0" rx="5" fill